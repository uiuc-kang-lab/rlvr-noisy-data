# @package environment.skyrl_gym
# number of background workers for env step calls. Set to 0 to disable background workers.
max_env_workers: 32

text2sql:
  db_path: "/home/ray/default/sql_data"
  db_modification_scripts_path: "/home/ray/default/sql_data/db_modification_scripts"
  random_perturb: false

llm_as_a_judge:
  model: "gpt-4o-mini"
  base_url: null  # or a local endpoint: http://localhost:8000/v1

search:
  log_requests: false
  search_url: "http://127.0.0.1:8000/retrieve"
  topk: 3
  timeout: 30

gsm8k:
  random_perturb: false

math_hard:
  format_reward_only: false
  noise_rate: 0
